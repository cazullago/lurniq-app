name: lurniq
description: "Lurniq — a smarter way to learn. A global student learning and study app."
publish_to: "none"
version: 2.0.0+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  path_provider: ^2.1.5
  path: ^1.9.1
  image_picker: ^1.2.0
  uuid: ^4.5.1
  # Pinned: permission_handler v13 requires compileSdk 37 and breaks the
  # android-36 build. Revisit only when compileSdk moves to 37+.
  permission_handler: ^12.0.3
  url_launcher: ^6.3.2
  # Local notifications: tutor booking alerts, 1v1 session reminder alarms,
  # task reminders. v19 needs core-library desugaring on android-36 builds
  # (see android/app/build.gradle.kts).
  flutter_local_notifications: ^19.5.0
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Generates mipmap PNGs + adaptive icon from the original SVG artwork in
# assets/icon/. Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/lurniq-icon.svg"
  adaptive_icon_background: "#FFF7ED"
  adaptive_icon_foreground: "assets/icon/lurniq-icon-foreground.svg"
  adaptive_icon_monochrome: "assets/icon/lurniq-icon-foreground.svg"
  min_sdk_android: 21
