name: Build Lurniq Android artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAR_OPTIONS: --no-same-owner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      # Optional: real release signing for Google Play. Wire the four secrets
      # (see PLAY_RELEASE_CHECKLIST.md). Without them the AAB below is
      # debug-signed — a performance/size reference only, NOT for upload.
      - name: Prepare upload keystore (release signing)
        if: ${{ secrets.LURNIQ_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.LURNIQ_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload.keystore
          {
            echo "LURNIQ_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/upload.keystore"
            echo "LURNIQ_STORE_PASSWORD=${{ secrets.LURNIQ_STORE_PASSWORD }}"
            echo "LURNIQ_KEY_ALIAS=${{ secrets.LURNIQ_KEY_ALIAS }}"
            echo "LURNIQ_KEY_PASSWORD=${{ secrets.LURNIQ_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lurniq-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: lurniq-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
